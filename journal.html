<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Journal Scout - 期刊详情</title>
  <link rel="icon" type="image/webp" href="./assets/journal-logo-home-288.webp" />
  <link rel="stylesheet" href="./styles.css?v=20261113-single-focus" />
  <link rel="stylesheet" href="./extension-install.css?v=20261113-single-focus" />
  <link rel="prefetch" href="./index.html" as="document" />
</head>
<body class="detail-page with-global-nav">
  <header class="scansci-global-nav">
    <div class="brand-cluster">
      <a class="brand" href="https://www.scansci.com/" aria-label="ScanSci 首页">
        <img class="brand-logo" src="./assets/brand/scansci-app-icon-64.webp" alt="" width="30" height="30">
        <span>ScanSci</span>
      </a>
      <a class="product-brand" href="./index.html" aria-label="Journal Scout 首页">Journal Scout</a>
    </div>
    <nav class="product-links" aria-label="Journal Scout 导航"><a class="extension-install-link" href="./extension-install.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5a2 2 0 1 1 4 0V5h4.5A1.5 1.5 0 0 1 20 6.5V10h-1.5a2 2 0 0 0 0 4H20v4.5a1.5 1.5 0 0 1-1.5 1.5H14v-1.5a2 2 0 1 0-4 0V20H5.5A1.5 1.5 0 0 1 4 18.5V14h1.5a2 2 0 1 0 0-4H4V6.5A1.5 1.5 0 0 1 5.5 5H10z"/></svg>插件下载</a><a class="updates-nav-link" href="./updates.html">更新说明</a></nav>
  </header>
  <header class="hero hero--detail">
    <div class="hero__content">
      <h1 id="title">加载中...</h1>
      <p class="subtitle" id="subtitle">正在读取期刊信息</p>
      <div class="tags" id="topTags"></div>
    </div>
  </header>

  <main class="detail-main">
    <aside class="detail-sidebar">
      <section class="panel panel--wide panel--core">
        <h2>核心信息</h2>
        <div class="detail-grid detail-grid--wide" id="coreGrid"></div>
      </section>

      <section class="panel panel--wide panel--submission" hidden>
        <h2>投稿参考</h2>
        <div id="submissionPanel" class="submission-panel">
          <p class="placeholder">正在加载投稿参考...</p>
        </div>
      </section>

      <section class="panel panel--wide panel--hq">
        <h2>科协高质量期刊分级 <button class="info-dot" type="button" data-info="hq" aria-label="查看数据说明">?</button></h2>
        <div class="detail-grid" id="hqMetaGrid"></div>
        <div id="hqRecordList" class="hq-record-list"></div>
      </section>

      <section class="panel panel--wide panel--evidence">
        <h2>风险预警</h2>
        <div id="paperEvidencePanel" class="paper-evidence-panel">
          <p class="placeholder">正在加载风险预警...</p>
        </div>
      </section>
    </aside>

    <div class="detail-content">
      <section class="panel panel--wide panel--spotlight">
        <h2>期刊概览</h2>
        <div class="spotlight-layout">
          <div class="spotlight-visual">
            <div class="spotlight-cover" id="spotlightCover"></div>
          </div>
          <div class="spotlight-content">
            <div class="spotlight-link-row">
              <a id="journalWebsite" class="spotlight-link" href="#" target="_blank" rel="noopener noreferrer">访问期刊官网</a>
            </div>
            <div class="spotlight-top">
              <aside class="citescore-card impact-card" id="citeScoreCard">
                <div class="impact-card__head">影响指标</div>
                <div class="impact-card__numbers">
                  <div class="impact-number impact-number--primary">
                    <span class="impact-number__label">影响因子 IF <span id="impactIfNewBadge" class="if-new-badge" hidden>NEW</span></span>
                    <div class="impact-if-row">
                      <strong id="impactIfValue">-</strong>
                      <span id="impactIfDelta" class="impact-if-delta" hidden></span>
                    </div>
                    <em id="impactIfMeta">-</em>
                  </div>
                  <div class="impact-number impact-number--five-year">
                    <span class="impact-number__label" title="五年影响因子，独立于年度 IF">五年影响因子 IF5</span>
                    <strong id="impactIf5Value">-</strong>
                    <em id="impactIf5Meta">-</em>
                  </div>
                  <div class="impact-number impact-number--secondary">
                    <span class="impact-number__label">
                      CiteScore
                      <button class="inline-info" type="button" data-info="citescore" aria-label="查看数据说明">?</button>
                    </span>
                    <strong><span id="citeScoreValue">-</span></strong>
                    <em id="citeScoreMeta" class="is-muted">等待官方数据</em>
                  </div>
                </div>
                <div class="citescore-metrics" id="citeScoreMetrics"></div>
                <div class="citescore-stars" id="citeScoreStars"></div>
                <div class="citescore-percent-row">
                  <span class="citescore-percent-label" id="citeScorePercentLabel">学科百分位</span>
                  <span class="citescore-percent-value" id="citeScorePercentValue">-</span>
                </div>
                <div class="citescore-percent-track"><span id="citeScorePercentFill"></span></div>
                <div class="citescore-breakdown" id="citeScoreBreakdown"></div>
                <div class="citescore-source" id="citeScoreSource">来源：待识别</div>
              </aside>
            </div>
          </div>
          <div class="detail-grid detail-grid--wide spotlight-grid spotlight-grid--under-cover" id="spotlightGrid">
            <div class="kv">
              <div class="k">出版商</div>
              <div class="v is-muted" id="spotPublisher">待补充</div>
            </div>
            <div class="kv">
              <div class="k">收录类型 <button class="inline-info" type="button" data-info="index_type" aria-label="查看收录类型说明">?</button></div>
              <div class="v is-muted" id="spotIndexType">待补充</div>
            </div>
            <div class="kv">
              <div class="k">OA模式 <button class="inline-info" type="button" data-info="oa" aria-label="查看 OA 模式说明">?</button></div>
              <div class="v is-muted" id="spotOA">待补充</div>
            </div>
            <div class="kv">
              <div class="k">OA发表APC <button class="inline-info" type="button" data-info="apc" aria-label="查看 APC 费用说明">?</button></div>
              <div class="v is-muted" id="spotApc">暂无数据</div>
            </div>
            <div class="kv">
              <div class="k">创刊参考年</div>
              <div class="v is-muted" id="spotPublishYear">待补充</div>
            </div>
            <div class="kv">
              <div class="k">年发文量 <button class="inline-info" type="button" data-info="annual_articles" aria-label="查看年发文量说明">?</button></div>
              <div class="v is-muted" id="spotAnnualArticles">待补充</div>
            </div>
          </div>
          <div class="spotlight-summary-wrap">
            <p class="spotlight-summary" id="journalSummary"></p>
          </div>
        </div>
      </section>

      <aside class="detail-rail">
        <section class="panel panel--wide panel--trend">
          <div class="trend-panel-head">
            <h2>历年评价趋势</h2>
            <div class="trend-tabs" role="tablist" aria-label="历年评价趋势">
              <button id="trendTabIf" class="trend-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="ifTrendChart" data-trend-tab="if">IF</button>
              <button id="trendTabCas" class="trend-tab" type="button" role="tab" aria-selected="false" aria-controls="casTrendChart" data-trend-tab="cas">中科院</button>
              <button id="trendTabAnnual" class="trend-tab" type="button" role="tab" aria-selected="false" aria-controls="annualTrendChart" data-trend-tab="annual">发文量</button>
            </div>
          </div>
          <div class="trend-stage">
            <div class="trend-stage-head">
              <h3 id="trendStageTitle">IF 历年变化</h3>
              <button id="trendStageZoom" class="chart-zoom-btn" type="button" data-chart-zoom="ifTrendChart" data-chart-title="IF 历年变化" data-tip="点击放大" aria-label="放大 IF 历年变化图">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="11" cy="11" r="6.5"></circle>
                  <line x1="16" y1="16" x2="21" y2="21"></line>
                </svg>
              </button>
            </div>
            <div id="trendStageChart" class="trend-stage-chart">
              <div id="ifTrendChart" class="if-trend-chart trend-chart-pane is-active" role="tabpanel" aria-labelledby="trendTabIf"></div>
              <div id="casTrendChart" class="cas-trend-chart trend-chart-pane" role="tabpanel" aria-labelledby="trendTabCas" hidden></div>
              <div id="annualTrendChart" class="annual-trend-chart trend-chart-pane" role="tabpanel" aria-labelledby="trendTabAnnual" hidden></div>
            </div>
          </div>
        </section>
      </aside>

      <section class="panel panel--wide panel--related">
        <h2>相近期刊</h2>
        <div id="relatedList" class="related-list"></div>
      </section>
    </div>
  </main>

  <div id="sourceModal" class="source-modal" hidden>
    <div class="source-modal__backdrop" data-close-source></div>
    <div class="source-modal__card" role="dialog" aria-modal="true" aria-labelledby="sourceModalTitle">
      <button id="sourceModalClose" class="source-modal__close" type="button" aria-label="关闭">×</button>
      <h3 id="sourceModalTitle">数据说明</h3>
      <div id="sourceModalBody" class="source-modal__body"></div>
    </div>
  </div>

  <div id="chartModal" class="chart-modal" hidden>
    <div class="chart-modal__backdrop" data-close-chart></div>
    <div class="chart-modal__card" role="dialog" aria-modal="true" aria-labelledby="chartModalTitle">
      <button id="chartModalClose" class="chart-modal__close" type="button" aria-label="关闭">×</button>
      <h3 id="chartModalTitle">图表大图</h3>
      <div id="chartModalBody" class="chart-modal__body"></div>
    </div>
  </div>

  <script src="./catalogs-core.js?v=1"></script>
  <script src="./catalogs-display.js?v=1"></script>
  <script src="./badges.js?v=20261113-catalogs"></script>
  <script src="./detail.js?v=20261113-catalogs"></script>
</body>
</html>
