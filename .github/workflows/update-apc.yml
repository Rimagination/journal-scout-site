name: Update official APC data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-apc-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APC parser dependency
        run: python -m pip install --disable-pip-version-check PyMuPDF

      - name: Fetch publisher APC price lists
        run: python scripts/update_official_apc_prices.py

      - name: Validate compact runtime assets
        shell: bash
        run: |
          set -euo pipefail
          node --check detail.js
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data")
          index = json.loads((root / "official_apc_lookup_index.json").read_text(encoding="utf-8"))
          issns = json.loads((root / "official_apc_issns.json").read_text(encoding="utf-8"))
          chunks = sorted((root / "official_apc_records").glob("chunk-*.json"))
          records = []
          for path in chunks:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload["start"] == len(records), (path, payload["start"], len(records))
              records.extend(payload["records"])

          assert len(records) == index["meta"]["record_count"]
          assert len(chunks) == index["chunk_count"]
          assert len(records) >= 1000
          assert "00000000" not in index["by_issn"]
          assert "00001234" not in index["by_issn"]
          assert all(
              0 <= int(record_index) < len(records)
              for values in index["by_issn"].values()
              for record_index in (values if isinstance(values, list) else [values])
          )
          assert issns["issns"]
          print({"records": len(records), "chunks": len(chunks), "issns": len(issns["issns"])})
          PY

      - name: Commit compact runtime assets when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official_apc_issns.json data/official_apc_lookup_index.json data/official_apc_records
          if git diff --cached --quiet; then
            echo "No APC changes"
            exit 0
          fi
          git commit -m "chore: update official APC data"
          git push

