<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Journal Scout - 期刊查询</title>
  <link rel="preconnect" href="https://www.scansci.com" crossorigin />
  <link rel="dns-prefetch" href="//www.scansci.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css" rel="stylesheet" />
  <link rel="icon" type="image/webp" href="./assets/journal-logo-home-288.webp" />
  <link rel="stylesheet" href="./styles.css?v=20261112-home-layout" />
  <link rel="stylesheet" href="./extension-install.css?v=20261112-nav" />
</head>
<body class="search-page with-global-nav">
  <header class="scansci-global-nav">
    <div class="brand-cluster">
      <a class="brand" href="https://www.scansci.com/" aria-label="ScanSci 首页">
        <img class="brand-logo" src="./assets/brand/scansci-app-icon-64.webp" alt="" width="30" height="30">
        <span>ScanSci</span>
      </a>
      <a class="product-brand" href="./index.html" aria-label="Journal Scout 首页">Journal Scout</a>
    </div>
    <nav class="product-links" aria-label="Journal Scout 导航">
      <a class="extension-install-link" href="./extension-install.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5a2 2 0 1 1 4 0V5h4.5A1.5 1.5 0 0 1 20 6.5V10h-1.5a2 2 0 0 0 0 4H20v4.5a1.5 1.5 0 0 1-1.5 1.5H14v-1.5a2 2 0 1 0-4 0V20H5.5A1.5 1.5 0 0 1 4 18.5V14h1.5a2 2 0 1 0 0-4H4V6.5A1.5 1.5 0 0 1 5.5 5H10z"/></svg>插件下载</a>
      <a class="updates-nav-link" href="./updates.html">更新说明</a>
    </nav>
  </header>
  <main class="search-main">
    <section class="search-shell search-shell--single">
      <div class="single-hero">
        <img class="single-logo" src="./assets/journal-logo-home-288.webp" alt="Journal Scout 标志" width="288" height="288" fetchpriority="high" decoding="async" />
        <h1 class="single-title-en">Journal Scout <span>期刊侦选</span></h1>
      </div>
      <div class="search-box search-box--single">
        <span class="search-box__icon" aria-hidden="true">
          <svg class="lucide lucide-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </span>
        <div class="search-box__field">
          <input
            id="searchInput"
            autocomplete="off"
            aria-label="搜索期刊、会议、缩写或 ISSN"
            placeholder="搜索期刊、会议、缩写或 ISSN"
          />
          <span class="search-box__placeholder" aria-hidden="true">
            <span>搜索期刊、会议、缩写或 ISSN</span>
            <span>从分区到风险一搜即明</span>
          </span>
        </div>
        <button id="searchClearBtn" class="search-box__clear" type="button" aria-label="清空搜索内容" hidden>
          <svg class="lucide lucide-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
        <button id="searchGoBtn" class="search-box__go" type="button" aria-label="进入详情">
          <svg class="lucide lucide-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </div>
      <div id="suggestionPanel" class="suggestion-panel" aria-live="polite"></div>
      <div class="home-quick-queries" aria-label="常用期刊示例">
        <button type="button" data-home-query="PRL">PRL</button>
        <button type="button" data-home-query="Nature Communications">Nature Communications</button>
        <button type="button" data-home-query="Environmental Research">Environmental Research</button>
        <button type="button" data-home-query="Journal of Cleaner Production">Journal of Cleaner Production</button>
      </div>
    </section>
  </main>

  <div id="cmdModal" class="cmd-modal" hidden>
    <div class="cmd-modal__backdrop" data-close-cmd></div>
    <div class="cmd-modal__card" role="dialog" aria-modal="true" aria-labelledby="cmdTitle">
      <div class="cmd-modal__head">
        <h2 id="cmdTitle">命令面板</h2>
        <button id="cmdClose" class="cmd-modal__close" type="button" aria-label="关闭">×</button>
      </div>
      <input id="cmdInput" class="cmd-input" placeholder="输入命令，如 > filter IF > 10" />
      <div id="cmdList" class="cmd-list"></div>
    </div>
  </div>

  <script src="./badges.js?v=20261112-ccf"></script>
  <script src="./ccf-conferences.js?v=20261112-ccf"></script>
  <script src="./app.js?v=20261112-ccf"></script>
</body>
</html>
